[package]
name = "punktfunk-client-web"
description = "The browser client — pf-console-ui on a WebGL2 canvas, wasm32-unknown-emscripten (design/web-client-implementation-plan.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# wasm only. Off it this is a bin that prints how to build it, exactly like punktfunk-setup-win
# off Windows — so `cargo build --workspace` on a developer's desktop stays green and does not
# resolve skia-safe for a target that would then want a second Skia archive.
[target.'cfg(target_family = "wasm")'.dependencies]
# The shell itself. `default-features = false`: `vulkan-overlay` is the session binary's, and it
# is also what would put `vulkan` on skia-safe and change the prebuilt key away from
# `gl-jpegd-jpege-pdf-textlayout` — the one rust-skia publishes for this target.
pf-console-ui = { path = "../../crates/pf-console-ui", default-features = false }
# The portable half — `trust::Settings` for the snapshot store the shell loads from.
pf-client-core = { path = "../../crates/pf-client-core", default-features = false }
# The SAME line pf-console-ui's wasm block carries, features included: two feature sets in one
# build resolve two prebuilt keys, and the second one puts a source build of Skia on the critical
# path. Only `host.rs` names it, to build the context and wrap the canvas.
skia-safe = { version = "0.99", features = ["gl", "textlayout"] }
# `transport::Transport` and the wire's datagram ceiling. No features: the browser plane is
# WebTransport, so nothing here wants `quic`.
punktfunk-core = { path = "../../crates/punktfunk-core" }
anyhow = "1"

[lints]
workspace = true
